name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-ci:
    name: Backend (Unit & E2E Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./helpdesk-backend
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: helpdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: './helpdesk-backend/pnpm-lock.yaml'
      
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit Tests
        run: pnpm run test

      - name: Prepare DB and Run E2E Tests
        env:
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/helpdesk_test?schema=public"
          JWT_SECRET: "ci-secret-key-super-secure"
        run: |
          pnpm prisma generate
          pnpm prisma db push
          pnpm run test:e2e

  frontend-ci:
    name: Frontend (Lint & Build Check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./helpdesk-frontend

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: './helpdesk-frontend/pnpm-lock.yaml'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Linting
        run: pnpm run lint

      - name: Validate Next.js Compilation
        run: pnpm run build